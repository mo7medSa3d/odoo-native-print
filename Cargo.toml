[workspace]
resolver = "2"
members = ["crates/print-core", "crates/print-raw", "crates/print-render", "crates/tools", "crates/print-ipp"]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
# Keep unwind: app/src-tauri/src/commands.rs::spawn_worker_loop uses std::panic::catch_unwind.
panic = "unwind"
