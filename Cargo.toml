[workspace]
resolver = "2"
members = ["crates/print-core", "crates/print-raw", "crates/print-render", "crates/tools", "crates/print-ipp"]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
