<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Yaseir Print — Tabs</title>
<link rel="stylesheet" href="theme.css"/>
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-chrome);
    color: var(--text-primary);
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding-inline: 8px;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Continuous bottom chrome seam sits behind the active tab so the active tab merges cleanly into the page */
  body::after {
    content: "";
    position: absolute;
    inset-inline: 0;
    inset-block-end: 0;
    height: 1px;
    background: var(--border);
    z-index: 1;
    pointer-events: none;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
    z-index: 2;
  }
  .tb-btn {
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .tb-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .tb-btn:active { background: var(--bg-subtle); }
  .tb-btn svg { width: 15px; height: 15px; }

  .divider {
    width: 1px;
    height: 18px;
    align-self: center;
    background: var(--border-strong);
    flex: 0 0 auto;
    margin-inline: 2px;
    opacity: 0.45;
  }

  .tabs {
    flex: 1 1 auto;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    height: 100%;
    padding-block-start: 6px;
    position: relative;
    z-index: 2;
  }
  .tabs::-webkit-scrollbar { display: none; }

  /* Browser-native borderless inactive tabs with subtle vertical separators */
  .tab {
    flex: 0 1 220px;
    min-width: 84px;
    max-width: 220px;
    height: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding-inline: 11px 6px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid transparent;
    border-block-end: 0;
    border-start-start-radius: var(--radius-md);
    border-start-end-radius: var(--radius-md);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition:
      background-color var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out);
  }
  .tab:not(.active):not(:hover)::after {
    content: "";
    position: absolute;
    inset-inline-end: -2px;
    top: 9px;
    bottom: 9px;
    width: 1px;
    background: var(--border-strong);
    opacity: 0.32;
    pointer-events: none;
  }
  .tab:has(+ .tab.active)::after,
  .tab:has(+ .tab:hover)::after,
  .tab:last-of-type::after { opacity: 0; }
  .tab:not(.active):hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .tab.dragging { opacity: 0.45; cursor: grabbing; }
  .tab.drop-hint {
    background: var(--brand-soft);
    color: var(--text-primary);
    border-color: var(--brand-text);
  }
  .tab.active {
    height: 38px;
    background: var(--bg-surface);
    color: var(--text-primary);
    border-color: var(--border);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    z-index: 3;
  }
  .tab.active::before {
    content: "";
    position: absolute;
    inset-block-start: -1px;
    inset-inline: 8px;
    height: 2.5px;
    border-end-start-radius: var(--radius-pill);
    border-end-end-radius: var(--radius-pill);
    background: var(--brand);
  }
  .tab .t-icon {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tab .t-icon-cc { color: var(--brand-text); }
  .tab .t-icon-settings { color: var(--text-secondary); }
  .tab.active .t-icon { color: var(--brand-text); }
  .tab.active .t-icon-settings { color: var(--text-primary); }
  .tab .t-title {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: var(--text-sm);
    line-height: var(--leading-tight);
  }
  .tab .t-pos {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--info-bg);
    color: var(--info-fg);
    border: 1px solid var(--info-border);
    padding: 1px 5px;
    border-radius: var(--radius-xs);
    line-height: 1.2;
  }
  .tab .t-close {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    opacity: 0.45;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .tab:hover .t-close,
  .tab.active .t-close,
  .tab .t-close:focus-visible { opacity: 1; }
  .tab .t-close:hover { background: var(--err-bg); color: var(--err-fg); }

  .tab-add {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    align-self: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-inline: 4px;
    margin-block-end: 2px;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .tab-add:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .tab-add svg { width: 14px; height: 14px; }

  .tb-utilities {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    z-index: 2;
  }

  .tb-action {
    flex: 0 0 auto;
    min-width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding-inline: 9px;
    background: transparent;
    color: var(--text-primary);
    font-size: var(--text-xs);
    font-weight: 600;
    font-family: inherit;
    transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .tb-action:hover {
    background: var(--bg-hover);
    border-color: var(--border);
  }
  .tb-action:active { background: var(--bg-subtle); }
  .tb-action.brand {
    background: var(--bg-surface);
    border-color: var(--border);
    color: var(--brand-text);
  }
  .tb-action.brand:hover {
    background: var(--brand-soft);
    border-color: var(--brand-text);
  }
  .tb-action img { width: 14px; height: 14px; border-radius: 3px; }
  .tb-action svg { width: 14px; height: 14px; }

  .tb-btn:focus-visible,
  .tab-add:focus-visible,
  .tb-action:focus-visible,
  .tab:focus-visible,
  .tab .t-close:focus-visible {
    outline: 2px solid var(--brand-text);
    outline-offset: -2px;
    box-shadow: var(--focus-ring);
  }

  @media (max-width: 640px) {
    .tb-action span { display: none; }
    .tb-action { padding-inline: 7px; }
  }
</style>
</head>
<body>
  <div class="nav-group">
    <button type="button" class="tb-btn" id="btnBack" title="رجوع" aria-label="رجوع">
      <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="tb-btn" id="btnForward" title="تقدّم" aria-label="تقدّم">
      <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button type="button" class="tb-btn" id="btnReload" title="تحديث" aria-label="تحديث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="tabs" id="tabs" role="tablist" aria-label="التبويبات"></div>

  <div class="divider" aria-hidden="true"></div>

  <div class="tb-utilities">
    <button type="button" class="tb-action brand" id="btnCc" title="مركز التحكم">
      <img src="app-icon.png" alt="" aria-hidden="true"/>
      <span data-i18n="cc">مركز التحكم</span>
    </button>
    <button type="button" class="tb-action" id="btnSettings" title="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </div>

<script>
  "use strict";
  function invoke(cmd, args) {
    if (!window.__TAURI_INTERNALS__ || typeof window.__TAURI_INTERNALS__.invoke !== "function") {
      return Promise.reject(new Error("tauri_internals_unavailable"));
    }
    return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  }
  var STR = {
    ar: {
      new_tab: "تبويب جديد", cc: "مركز التحكم", settings: "الإعدادات",
      back: "رجوع", forward: "تقدّم", reload: "تحديث", close_tab: "إغلاق", tabs_label: "التبويبات"
    },
    en: {
      new_tab: "New tab", cc: "Control Center", settings: "Settings",
      back: "Back", forward: "Forward", reload: "Reload", close_tab: "Close", tabs_label: "Tabs"
    }
  };
  var lang = "";
  var theme = "";
  function applyPrefs() {
    var savedLang = null, savedTheme = null;
    try {
      savedLang = localStorage.getItem("np_cc_lang");
      savedTheme = localStorage.getItem("np_cc_theme");
    } catch (e) {}
    var nextLang = savedLang === "en" ? "en" : "ar";
    if (nextLang !== lang || !document.documentElement.lang) {
      lang = nextLang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var v = STR[lang][el.getAttribute("data-i18n")];
        if (v) el.textContent = v;
      });
      var tips = [
        ["btnBack", STR[lang].back],
        ["btnForward", STR[lang].forward],
        ["btnReload", STR[lang].reload],
        ["btnCc", STR[lang].cc],
        ["btnSettings", STR[lang].settings]
      ];
      tips.forEach(function (pair) {
        var b = document.getElementById(pair[0]);
        if (b) { b.title = pair[1]; b.setAttribute("aria-label", pair[1]); }
      });
      var tabList = document.getElementById("tabs");
      if (tabList) tabList.setAttribute("aria-label", STR[lang].tabs_label);
      if (currentTabs.length) render(currentTabs);
    }
    var nextTheme = savedTheme === "dark" ? "dark" : "light";
    if (nextTheme !== theme || !document.documentElement.getAttribute("data-theme")) {
      theme = nextTheme;
      document.documentElement.setAttribute("data-theme", theme);
    }
  }
  var lastSignature = "";
  var currentTabs = [];
  var dragLabel = null;
  var refreshing = false;

  function tabKind(tab) {
    var u = String(tab.url || "");
    if (u.indexOf("index.html") >= 0 || (tab.is_local && /\/+$/.test(u))) return "cc";
    if (u.indexOf("settings.html") >= 0) return "settings";
    return "web";
  }

  function tabIconSvg(kind) {
    if (kind === "cc") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>';
    }
    if (kind === "settings") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="3.6" y1="9" x2="20.4" y2="9"/><line x1="3.6" y1="15" x2="20.4" y2="15"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  }

  function dropIndexFor(i, clientX, rect) {
    var width = rect.width || 1;
    var frac = (clientX - rect.left) / width;
    var after = document.documentElement.dir === "rtl" ? frac < 0.5 : frac >= 0.5;
    var idx = i + (after ? 1 : 0);
    var from = -1;
    currentTabs.forEach(function (t, j) { if (t.label === dragLabel) from = j; });
    if (from > -1 && from < idx) idx -= 1;
    return idx;
  }
  function clearDropHints(strip) {
    strip.querySelectorAll(".tab.drop-hint").forEach(function (n) {
      n.classList.remove("drop-hint");
    });
  }
  function render(tabs) {
    if (!Array.isArray(tabs) || dragLabel) return;
    var sig = lang + "|" + tabs.map(function (t) {
      return t.label + ":" + (t.title || "") + ":" + (t.url || "") + ":" + (t.active ? 1 : 0) + ":" + (t.is_pos ? 1 : 0);
    }).join("|");
    if (sig === lastSignature) return;
    lastSignature = sig;
    currentTabs = tabs;
    var strip = document.getElementById("tabs");
    var activeEl = document.activeElement;
    var focusedLabel = activeEl && strip.contains(activeEl) && activeEl.getAttribute ? activeEl.getAttribute("data-label") : null;
    strip.innerHTML = "";
    tabs.forEach(function (t, tabIndex) {
      var el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "");
      el.title = t.url || "";
      el.draggable = true;
      el.setAttribute("role", "tab");
      el.setAttribute("aria-selected", t.active ? "true" : "false");
      el.setAttribute("tabindex", t.active ? "0" : "-1");
      el.setAttribute("data-label", t.label);
      el.addEventListener("dragstart", function (ev) {
        dragLabel = t.label;
        el.classList.add("dragging");
        if (ev.dataTransfer) {
          try { ev.dataTransfer.setData("text/plain", t.label); } catch (e) {}
          ev.dataTransfer.effectAllowed = "move";
        }
      });
      el.addEventListener("dragend", function () {
        dragLabel = null;
        el.classList.remove("dragging");
        clearDropHints(strip);
      });
      el.addEventListener("dragover", function (ev) {
        if (!dragLabel || dragLabel === t.label) return;
        ev.preventDefault();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = "move";
        clearDropHints(strip);
        el.classList.add("drop-hint");
      });
      el.addEventListener("dragleave", function () {
        el.classList.remove("drop-hint");
      });
      el.addEventListener("drop", function (ev) {
        if (!dragLabel) return;
        ev.preventDefault();
        var idx = dropIndexFor(tabIndex, ev.clientX || 0, el.getBoundingClientRect());
        var label = dragLabel;
        dragLabel = null;
        clearDropHints(strip);
        invoke("tab_move", { label: label, toIndex: idx }).then(refresh).catch(function () {});
      });
      var kind = tabKind(t);
      var icon = document.createElement("span");
      icon.className = "t-icon t-icon-" + kind;
      icon.innerHTML = tabIconSvg(kind);
      el.appendChild(icon);
      var safeTitle = (t.title != null && String(t.title).trim()) ? String(t.title) : (t.url || STR[lang].new_tab);
      var title = document.createElement("span");
      title.className = "t-title";
      title.textContent = safeTitle;
      el.appendChild(title);
      if (t.is_pos) {
        var tag = document.createElement("span");
        tag.className = "t-pos";
        tag.textContent = "POS";
        el.appendChild(tag);
      }
      var close = document.createElement("button");
      close.type = "button";
      close.className = "t-close";
      close.textContent = "×";
      close.title = STR[lang].close_tab;
      close.setAttribute("aria-label", STR[lang].close_tab + ": " + safeTitle);
      close.addEventListener("click", function (ev) {
        ev.stopPropagation();
        invoke("tab_close", { label: t.label }).then(refresh).catch(function () {});
      });
      el.appendChild(close);
      el.addEventListener("click", function () {
        invoke("tab_switch", { label: t.label }).then(refresh).catch(function () {});
      });
      el.addEventListener("keydown", function (ev) {
        if (ev.target !== el) return;
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          invoke("tab_switch", { label: t.label }).then(refresh).catch(function () {});
          return;
        }
        var tabNodes = Array.prototype.slice.call(strip.querySelectorAll(".tab"));
        if (!tabNodes.length) return;
        var rtl = document.documentElement.dir === "rtl";
        var nextIdx = null;
        if (ev.key === (rtl ? "ArrowLeft" : "ArrowRight")) nextIdx = (tabIndex + 1) % tabNodes.length;
        else if (ev.key === (rtl ? "ArrowRight" : "ArrowLeft")) nextIdx = (tabIndex - 1 + tabNodes.length) % tabNodes.length;
        else if (ev.key === "Home") nextIdx = 0;
        else if (ev.key === "End") nextIdx = tabNodes.length - 1;
        if (nextIdx !== null) {
          ev.preventDefault();
          tabNodes[nextIdx].focus();
        }
      });
      strip.appendChild(el);
    });
    var add = document.createElement("button");
    add.type = "button";
    add.className = "tab-add";
    add.id = "btnNewTab";
    add.title = STR[lang].new_tab;
    add.setAttribute("aria-label", STR[lang].new_tab);
    add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    add.addEventListener("click", function () {
      invoke("tab_open", { url: "" }).then(refresh).catch(function () {
        invoke("open_control_center", {}).then(refresh).catch(function () {});
      });
    });
    strip.appendChild(add);
    if (focusedLabel) {
      var restore = strip.querySelector('.tab[data-label="' + focusedLabel.replace(/["\\]/g, "\\$&") + '"]');
      if (restore && restore.focus) restore.focus();
    }
    var active = strip.querySelector(".tab.active");
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }
  function refresh() {
    applyPrefs();
    if (refreshing) return;
    refreshing = true;
    invoke("tab_list", {}).then(render).catch(function () {}).finally(function () {
      refreshing = false;
    });
  }
  var stripEl = document.getElementById("tabs");
  stripEl.addEventListener("dragover", function (ev) {
    if (dragLabel && ev.target === stripEl) {
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = "move";
    }
  });
  stripEl.addEventListener("drop", function (ev) {
    if (!dragLabel || ev.target !== stripEl) return;
    ev.preventDefault();
    var label = dragLabel;
    dragLabel = null;
    clearDropHints(stripEl);
    invoke("tab_move", { label: label, toIndex: currentTabs.length })
      .then(refresh).catch(function () {});
  });
  // Recover if drag ends outside the WebView2 tabbar bounds without firing dragend
  function resetDragState() {
    if (!dragLabel) return;
    dragLabel = null;
    stripEl.querySelectorAll(".tab.dragging").forEach(function (n) { n.classList.remove("dragging"); });
    clearDropHints(stripEl);
  }
  window.addEventListener("blur", resetDragState);
  window.addEventListener("pointerup", resetDragState);
  document.getElementById("btnBack").addEventListener("click", function () {
    invoke("nav_back", {}).catch(function () {});
  });
  document.getElementById("btnForward").addEventListener("click", function () {
    invoke("nav_forward", {}).catch(function () {});
  });
  document.getElementById("btnReload").addEventListener("click", function () {
    invoke("nav_reload", {}).catch(function () {});
  });
  document.getElementById("btnSettings").addEventListener("click", function () {
    invoke("open_settings", {}).then(refresh).catch(function () {});
  });
  document.getElementById("btnCc").addEventListener("click", function () {
    invoke("open_control_center", {}).then(refresh).catch(function () {});
  });
  window.addEventListener("storage", applyPrefs);
  applyPrefs();
  refresh();
  window.setInterval(function () { if (!document.hidden) refresh(); }, 650);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
</script>
</body>
</html>
