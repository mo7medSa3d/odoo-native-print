<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Yaseir Print — Tabs</title>
<link rel="stylesheet" href="theme.css"/>
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    padding-inline: 10px;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: var(--glass-highlight);
  }
  body::after {
    content: "";
    position: absolute;
    inset-inline: 0;
    inset-block-end: 0;
    height: 1px;
    background: var(--border);
    z-index: 1;
    pointer-events: none;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
    z-index: 2;
  }
  .tb-btn {
    width: 30px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition:
      background-color var(--dur-fast) var(--ease-spring),
      color var(--dur-fast) var(--ease-spring),
      transform var(--dur-fast) var(--ease-spring);
  }
  .tb-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .tb-btn:active { transform: scale(0.93); background: var(--bg-subtle); }
  .tb-btn svg { width: 15px; height: 15px; }

  .divider {
    width: 1px;
    height: 18px;
    align-self: center;
    background: var(--border-strong);
    flex: 0 0 auto;
    margin-inline: 2px;
    opacity: 0.35;
  }

  .tabs {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    height: 100%;
    padding-block: 5px;
    position: relative;
    z-index: 2;
    touch-action: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 1 215px;
    min-width: 84px;
    max-width: 215px;
    height: 34px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding-inline: 11px 6px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: grab;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    position: relative;
    transition:
      background-color var(--dur-fast) var(--ease-spring),
      color var(--dur-fast) var(--ease-spring),
      border-color var(--dur-fast) var(--ease-spring),
      box-shadow var(--dur-fast) var(--ease-spring),
      transform var(--dur-fast) var(--ease-spring);
  }
  .tab.is-pinned {
    flex: 0 0 auto;
    min-width: 44px;
    max-width: 118px;
    padding-inline: 9px;
  }
  .tab:not(.active):not(:hover):not(.dragging)::after {
    content: "";
    position: absolute;
    inset-inline-end: -3px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: var(--border-strong);
    opacity: 0.28;
    pointer-events: none;
  }
  .tab:has(+ .tab.active)::after,
  .tab:has(+ .tab:hover)::after,
  .tab:last-of-type::after { opacity: 0; }
  .tab:not(.active):hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .tab.dragging {
    opacity: 0.92;
    cursor: grabbing;
    background: var(--glass-bg-strong);
    border-color: var(--brand);
    box-shadow: var(--shadow-md);
    z-index: 20;
    transition: none;
  }
  .tab.drop-hint {
    background: var(--brand-soft);
    color: var(--text-primary);
    border-color: var(--brand);
    box-shadow: inset 0 0 0 1px var(--brand);
  }
  .tab.active {
    background: var(--bg-surface);
    color: var(--text-primary);
    border-color: var(--border);
    font-weight: 600;
    box-shadow: var(--shadow-sm), var(--glass-highlight);
    z-index: 3;
  }
  .tab.active::before {
    content: "";
    position: absolute;
    inset-block-end: 0;
    inset-inline: 14px;
    height: 2px;
    border-radius: var(--radius-pill);
    background: var(--brand);
  }
  .tab.group-blue { border-block-start: 2px solid var(--chart-1); }
  .tab.group-teal { border-block-start: 2px solid var(--chart-2); }
  .tab.group-orange { border-block-start: 2px solid var(--destructive); }
  .tab.group-mint { border-block-start: 2px solid var(--chart-4); }

  .tab .t-icon {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tab .t-icon-cc { color: var(--brand-text); }
  .tab .t-icon-settings { color: var(--text-secondary); }
  .tab.active .t-icon { color: var(--brand-text); }
  .tab.active .t-icon-settings { color: var(--text-primary); }
  .tab .t-title {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: var(--text-sm);
    line-height: var(--leading-tight);
  }
  .tab .t-pos {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--info-bg);
    color: var(--info-fg);
    border: 1px solid var(--info-border);
    padding: 1px 6px;
    border-radius: var(--radius-pill);
    line-height: 1.25;
  }
  .tab .t-close {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    opacity: 0.48;
    transition:
      background-color var(--dur-fast) var(--ease-spring),
      color var(--dur-fast) var(--ease-spring),
      opacity var(--dur-fast) var(--ease-spring);
  }
  .tab:hover .t-close,
  .tab.active .t-close,
  .tab .t-close:focus-visible { opacity: 1; }
  .tab .t-close:hover { background: var(--err-bg); color: var(--err-fg); }

  .tab-add {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    align-self: center;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-inline: 2px;
    transition:
      background-color var(--dur-fast) var(--ease-spring),
      color var(--dur-fast) var(--ease-spring),
      transform var(--dur-fast) var(--ease-spring);
  }
  .tab-add:hover {
    background: var(--bg-hover);
    color: var(--brand-text);
  }
  .tab-add:active { transform: scale(0.92); }
  .tab-add svg { width: 14px; height: 14px; }

  .tb-utilities {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    z-index: 2;
  }

  .tb-action {
    flex: 0 0 auto;
    min-width: 28px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding-inline: 10px;
    background: transparent;
    color: var(--text-primary);
    font-size: var(--text-xs);
    font-weight: 600;
    font-family: inherit;
    transition:
      background-color var(--dur-fast) var(--ease-spring),
      border-color var(--dur-fast) var(--ease-spring),
      color var(--dur-fast) var(--ease-spring),
      transform var(--dur-fast) var(--ease-spring);
  }
  .tb-action:hover {
    background: var(--bg-hover);
    border-color: var(--border);
  }
  .tb-action:active { transform: scale(0.96); background: var(--bg-subtle); }
  .tb-action.brand {
    background: var(--bg-surface);
    border-color: var(--border);
    color: var(--brand-text);
    box-shadow: var(--shadow-sm);
  }
  .tb-action.brand:hover {
    background: var(--brand-soft);
    border-color: var(--brand);
  }
  .tb-action img { width: 14px; height: 14px; border-radius: 4px; }
  .tb-action svg { width: 14px; height: 14px; }

  .tb-btn:focus-visible,
  .tab-add:focus-visible,
  .tb-action:focus-visible,
  .tab:focus-visible,
  .tab .t-close:focus-visible {
    outline: 2px solid var(--brand-text);
    outline-offset: -2px;
    box-shadow: var(--focus-ring);
  }

  @media (max-width: 720px) {
    .tb-action span { display: none; }
    .tb-action { padding-inline: 7px; }
  }
</style>
</head>
<body>
  <div class="nav-group">
    <button type="button" class="tb-btn" id="btnBack" title="رجوع" aria-label="رجوع">
      <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="tb-btn" id="btnForward" title="تقدّم" aria-label="تقدّم">
      <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button type="button" class="tb-btn" id="btnReload" title="تحديث" aria-label="تحديث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="tabs" id="tabs" role="tablist" aria-label="التبويبات"></div>

  <div class="divider" aria-hidden="true"></div>

  <div class="tb-utilities">
    <button type="button" class="tb-action brand" id="btnCc" title="مركز التحكم">
      <img src="app-icon.png" alt="" aria-hidden="true"/>
      <span data-i18n="cc">مركز التحكم</span>
    </button>
    <button type="button" class="tb-action" id="btnSettings" title="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </div>

<script>
  "use strict";
  function invoke(cmd, args) {
    if (!window.__TAURI_INTERNALS__ || typeof window.__TAURI_INTERNALS__.invoke !== "function") {
      return Promise.reject(new Error("tauri_internals_unavailable"));
    }
    return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  }
  var STR = {
    ar: {
      new_tab: "تبويب جديد", cc: "مركز التحكم", settings: "الإعدادات",
      back: "رجوع", forward: "تقدّم", reload: "تحديث", close_tab: "إغلاق", tabs_label: "التبويبات"
    },
    en: {
      new_tab: "New tab", cc: "Control Center", settings: "Settings",
      back: "Back", forward: "Forward", reload: "Reload", close_tab: "Close", tabs_label: "Tabs"
    }
  };
  var lang = "";
  var theme = "";
  var VALID_GROUPS = { blue: true, teal: true, orange: true, mint: true };
  function readJson(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function readPinned() {
    var v = readJson("np_pinned_tabs", []);
    return Array.isArray(v) ? v : [];
  }
  function readGroups() {
    var v = readJson("np_tab_groups", {});
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  }
  function isSafeTabUrl(u) {
    if (u === "") return true;
    if (typeof u !== "string" || !/^https?:\/\//i.test(u)) return false;
    try {
      var parsed = new URL(u);
      return (parsed.protocol === "https:" || parsed.protocol === "http:") && parsed.hostname.length > 0 && !parsed.username && !parsed.password;
    } catch (e) { return false; }
  }
  function writeJson(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // --- Browser-like session restore -------------------------------------
  // render() mirrors the live strip into localStorage on every change,
  // so the last session is always available here before the first render
  // replaces it with the single boot tab.
  function isLocalTabUrl(u) {
    try {
      var parsed = new URL(u);
      return (
        (parsed.protocol === "tauri:" && parsed.hostname === "localhost") ||
        ((parsed.protocol === "http:" || parsed.protocol === "https:") &&
          parsed.hostname === "tauri.localhost")
      );
    } catch (e) { return false; }
  }
  function isRestorableTabUrl(u) {
    if (typeof u !== "string" || !u || u.length > 8192) return false;
    try {
      var parsed = new URL(u);
      if (parsed.username || parsed.password) return false;
      if (isLocalTabUrl(u)) return true;
      return parsed.protocol === "http:" || parsed.protocol === "https:";
    } catch (e) { return false; }
  }
  function isInitialTabUrl(u) {
    if (!isRestorableTabUrl(u)) return false;
    if (isLocalTabUrl(u)) {
      return /\/boot\.html$/i.test(u) || /\/index\.html$/i.test(u) || /\/$/.test(u);
    }
    try {
      var parsed = new URL(u);
      // boot.html redirects the first tab to the configured Odoo root;
      // do not restore a duplicate of it. POS tabs are never skipped.
      return (
        !/\/pos(\/|$)/i.test(u) &&
        (parsed.pathname === "/" || parsed.pathname === "/web" || parsed.pathname === "/web/login")
      );
    } catch (e) { return false; }
  }
  var restoringSession = false;
  function restoreSavedSession() {
    var saved = readJson("np_open_tabs", []);
    if (!Array.isArray(saved) || saved.length < 2) return;
    restoringSession = true;
    var finishRestore = function () {
      restoringSession = false;
      lastSignature = "";
      refresh();
    };
    invoke("app_identity", {}).catch(function () { return null; }).then(function (ov) {
      var startupUrl = ov && (ov.startupUrl || ov.startup_url) ? String(ov.startupUrl || ov.startup_url) : "";
      var activeIdx = 0;
      saved.forEach(function (tab, i) { if (tab && tab.active) activeIdx = i; });
      var firstUrl = String((saved[0] && saved[0].url) || "");
      var skipFirst = (!!startupUrl && firstUrl === startupUrl) || isInitialTabUrl(firstUrl);
      var queue = saved.slice(skipFirst ? 1 : 0).map(function (tab) {
        return String((tab && tab.url) || "");
      }).filter(isRestorableTabUrl);
      var targetUrl = skipFirst && activeIdx === 0
        ? null
        : (saved[activeIdx] && saved[activeIdx].url) || null;
      if (!queue.length && !targetUrl) { finishRestore(); return; }
      var openNext = function () {
        if (queue.length) {
          var url = queue.shift();
          invoke("tab_open", { url: url })
            .catch(function () {})
            .finally(function () { openNext(); });
          return;
        }
        invoke("tab_list", {}).then(function (tabs) {
          if (Array.isArray(tabs) && tabs.length) {
            var targetLabel = null;
            if (skipFirst && activeIdx === 0) {
              targetLabel = tabs[0].label;
            } else if (targetUrl) {
              var match = tabs.find(function (tab) { return tab.url === targetUrl; });
              if (match) targetLabel = match.label;
            }
            if (targetLabel) {
              invoke("tab_switch", { label: targetLabel }).catch(function () {}).finally(finishRestore);
              return;
            }
          }
          finishRestore();
        }).catch(finishRestore);
      };
      openNext();
    });
  }

  function applyPrefs() {
    var savedLang = null, savedTheme = null;
    try {
      savedLang = localStorage.getItem("np_cc_lang");
      savedTheme = localStorage.getItem("np_cc_theme");
    } catch (e) {}
    var nextLang = savedLang === "en" ? "en" : "ar";
    if (nextLang !== lang || !document.documentElement.lang) {
      lang = nextLang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var v = STR[lang][el.getAttribute("data-i18n")];
        if (v) el.textContent = v;
      });
      var tips = [
        ["btnBack", STR[lang].back],
        ["btnForward", STR[lang].forward],
        ["btnReload", STR[lang].reload],
        ["btnCc", STR[lang].cc],
        ["btnSettings", STR[lang].settings]
      ];
      tips.forEach(function (pair) {
        var b = document.getElementById(pair[0]);
        if (b) { b.title = pair[1]; b.setAttribute("aria-label", pair[1]); }
      });
      var tabList = document.getElementById("tabs");
      if (tabList) tabList.setAttribute("aria-label", STR[lang].tabs_label);
      if (currentTabs.length) render(currentTabs);
    }
    var nextTheme = savedTheme === "dark" ? "dark" : "light";
    if (nextTheme !== theme || !document.documentElement.getAttribute("data-theme")) {
      theme = nextTheme;
      document.documentElement.setAttribute("data-theme", theme);
    }
  }
  var lastSignature = "";
  var currentTabs = [];
  var dragLabel = null;
  var ptrDrag = null;
  var lastDragEnd = 0;
  var refreshing = false;

  function tabKind(tab) {
    var u = String(tab.url || "");
    if (u.indexOf("index.html") >= 0 || (tab.is_local && /\/+$/.test(u))) return "cc";
    if (u.indexOf("settings.html") >= 0) return "settings";
    return "web";
  }

  function tabIconSvg(kind) {
    if (kind === "cc") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>';
    }
    if (kind === "settings") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="3.6" y1="9" x2="20.4" y2="9"/><line x1="3.6" y1="15" x2="20.4" y2="15"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  }

  function dropIndexFor(i, clientX, rect) {
    var width = rect.width || 1;
    var frac = (clientX - rect.left) / width;
    var after = document.documentElement.dir === "rtl" ? frac < 0.5 : frac >= 0.5;
    var idx = i + (after ? 1 : 0);
    var from = -1;
    currentTabs.forEach(function (t, j) { if (t.label === dragLabel) from = j; });
    if (from > -1 && from < idx) idx -= 1;
    return idx;
  }
  // Forgiving insertion index for pointer drags: "after" is a logical
  // (not visual) direction, so it works in both RTL and LTR strips.
  function insertionIndexFor(i, after) {
    var idx = i + (after ? 1 : 0);
    var from = ptrDrag ? ptrDrag.fromIndex : -1;
    if (from > -1 && from < idx) idx -= 1;
    return idx;
  }
  function clearDropHints(strip) {
    strip.querySelectorAll(".tab.drop-hint").forEach(function (n) {
      n.classList.remove("drop-hint");
    });
  }
  function rememberClosedTab(tab) {
    if (!tab || !tab.url || tab.is_local) return;
    var list = readJson("np_closed_tabs", []);
    if (!Array.isArray(list)) list = [];
    list = list.filter(function (item) { return item && item.url !== tab.url; });
    list.unshift({ url: tab.url, title: tab.title || tab.url, at: Date.now() });
    writeJson("np_closed_tabs", list.slice(0, 15));
  }
  function reopenLastClosedTab() {
    var list = readJson("np_closed_tabs", []);
    if (!Array.isArray(list) || !list.length) return;
    var last = list.shift();
    writeJson("np_closed_tabs", list);
    if (last && last.url && isSafeTabUrl(last.url)) {
      invoke("tab_open", { url: last.url }).then(refresh).catch(function () {});
    }
  }
  var closingLabels = Object.create(null);
  function closeTabWithHistory(tab) {
    if (!tab || !tab.label || closingLabels[tab.label]) return;
    closingLabels[tab.label] = true;
    rememberClosedTab(tab);
    var pinned = readPinned();
    var nextPins = pinned.filter(function (l) { return l !== tab.label; });
    if (nextPins.length !== pinned.length) writeJson("np_pinned_tabs", nextPins);
    var groups = readGroups();
    if (Object.prototype.hasOwnProperty.call(groups, tab.label)) {
      delete groups[tab.label];
      writeJson("np_tab_groups", groups);
    }
    invoke("tab_close", { label: tab.label })
      .then(refresh)
      .catch(function () {})
      .finally(function () { delete closingLabels[tab.label]; });
  }

  function render(tabs) {
    if (!Array.isArray(tabs) || dragLabel) return;
    var pinned = readPinned();
    var groups = readGroups();
    var metaSig = JSON.stringify([pinned, groups]);
    var sig = lang + "|" + metaSig + "|" + tabs.map(function (t) {
      return t.label + ":" + (t.title || "") + ":" + (t.url || "") + ":" + (t.active ? 1 : 0) + ":" + (t.is_pos ? 1 : 0);
    }).join("|");
    if (sig === lastSignature) return;
    lastSignature = sig;
    currentTabs = tabs;
    // Mirror live tabs to localStorage so Control Center sidebar stays live (skip while restoring startup session)
    if (!restoringSession) writeJson("np_open_tabs", tabs);
    var strip = document.getElementById("tabs");
    var activeEl = document.activeElement;
    var focusedInStrip = !!(activeEl && strip.contains(activeEl));
    var focusedNewTab = focusedInStrip && activeEl.id === "btnNewTab";
    var focusedLabel = focusedInStrip && activeEl.getAttribute ? activeEl.getAttribute("data-label") : null;
    strip.innerHTML = "";
    tabs.forEach(function (t, tabIndex) {
      var el = document.createElement("div");
      var isPinned = pinned.indexOf(t.label) >= 0;
      var rawGrp = Object.prototype.hasOwnProperty.call(groups, t.label) ? String(groups[t.label]) : "";
      var grp = VALID_GROUPS[rawGrp] ? rawGrp : "";
      el.className = "tab" + (t.active ? " active" : "") + (isPinned ? " is-pinned" : "") + (grp ? " group-" + grp : "");
      el.title = t.url || "";
      // Native HTML5 DnD is disabled on purpose: WebView2 shows the
      // "not allowed here" cursor and swallows pointer events when a
      // draggable element starts a native drag. Reordering is pure
      // pointer-driven, exactly like Chrome's tab strip.
      el.draggable = false;
      el.setAttribute("role", "tab");
      el.setAttribute("aria-selected", t.active ? "true" : "false");
      el.setAttribute("tabindex", t.active ? "0" : "-1");
      el.setAttribute("data-label", t.label);
      el.setAttribute("data-index", String(tabIndex));

      // Pointer-driven reorder: capture the pointer immediately so a
      // gesture can never turn into a native drag or a text selection.
      el.addEventListener("pointerdown", function (ev) {
        if (ev.button === 1) {
          ev.preventDefault();
          closeTabWithHistory(t);
          return;
        }
        if (ev.button !== 0 || (ev.target && ev.target.closest && ev.target.closest(".t-close"))) return;
        ptrDrag = {
          label: t.label,
          fromIndex: tabIndex,
          el: el,
          startX: ev.clientX || 0,
          active: false,
          targetIndex: tabIndex,
          pointerId: ev.pointerId
        };
        if (el.setPointerCapture && ev.pointerId != null) {
          try { el.setPointerCapture(ev.pointerId); } catch (e) {}
        }
      });

      // Keep HTML5 DnD listeners for fallback & automated test compatibility
      el.addEventListener("dragstart", function (ev) {
        dragLabel = t.label;
        el.classList.add("dragging");
        if (ev.dataTransfer) {
          try { ev.dataTransfer.setData("text/plain", t.label); } catch (e) {}
          ev.dataTransfer.effectAllowed = "move";
        }
      });
      el.addEventListener("dragend", function () {
        dragLabel = null;
        el.classList.remove("dragging");
        clearDropHints(strip);
      });
      el.addEventListener("dragover", function (ev) {
        if (!dragLabel || dragLabel === t.label) return;
        ev.preventDefault();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = "move";
        clearDropHints(strip);
        el.classList.add("drop-hint");
      });
      el.addEventListener("dragleave", function () {
        el.classList.remove("drop-hint");
      });
      el.addEventListener("drop", function (ev) {
        if (!dragLabel) return;
        ev.preventDefault();
        var idx = dropIndexFor(tabIndex, ev.clientX || 0, el.getBoundingClientRect());
        var label = dragLabel;
        dragLabel = null;
        clearDropHints(strip);
        invoke("tab_move", { label: label, toIndex: idx }).then(refresh).catch(function () {});
      });

      var kind = tabKind(t);
      var icon = document.createElement("span");
      icon.className = "t-icon t-icon-" + kind;
      icon.innerHTML = tabIconSvg(kind);
      el.appendChild(icon);
      var safeTitle = (t.title != null && String(t.title).trim()) ? String(t.title) : (t.url || STR[lang].new_tab);
      var title = document.createElement("span");
      title.className = "t-title";
      title.textContent = safeTitle;
      el.appendChild(title);
      if (t.is_pos) {
        var tag = document.createElement("span");
        tag.className = "t-pos";
        tag.textContent = "POS";
        el.appendChild(tag);
      }
      var close = document.createElement("button");
      close.type = "button";
      close.className = "t-close";
      close.textContent = "×";
      close.title = STR[lang].close_tab;
      close.setAttribute("aria-label", STR[lang].close_tab + ": " + safeTitle);
      close.addEventListener("click", function (ev) {
        ev.stopPropagation();
        closeTabWithHistory(t);
      });
      el.appendChild(close);
      el.addEventListener("click", function () {
        // A completed drag emits a click too; ignore it without ever
        // swallowing a genuine subsequent click (time-based guard).
        if (Date.now() - lastDragEnd < 300) return;
        invoke("tab_switch", { label: t.label }).then(refresh).catch(function () {});
      });
      el.addEventListener("keydown", function (ev) {
        if (ev.target !== el) return;
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          invoke("tab_switch", { label: t.label }).then(refresh).catch(function () {});
          return;
        }
        var tabNodes = Array.prototype.slice.call(strip.querySelectorAll(".tab"));
        if (!tabNodes.length) return;
        var rtl = document.documentElement.dir === "rtl";
        var nextIdx = null;
        if (ev.key === (rtl ? "ArrowLeft" : "ArrowRight")) nextIdx = (tabIndex + 1) % tabNodes.length;
        else if (ev.key === (rtl ? "ArrowRight" : "ArrowLeft")) nextIdx = (tabIndex - 1 + tabNodes.length) % tabNodes.length;
        else if (ev.key === "Home") nextIdx = 0;
        else if (ev.key === "End") nextIdx = tabNodes.length - 1;
        if (nextIdx !== null) {
          ev.preventDefault();
          tabNodes[nextIdx].focus();
        }
      });
      strip.appendChild(el);
    });
    var add = document.createElement("button");
    add.type = "button";
    add.className = "tab-add";
    add.id = "btnNewTab";
    add.title = STR[lang].new_tab;
    add.setAttribute("aria-label", STR[lang].new_tab);
    add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    add.addEventListener("click", function () {
      invoke("tab_open", { url: "" }).then(refresh).catch(function () {
        invoke("open_control_center", {}).then(refresh).catch(function () {});
      });
    });
    strip.appendChild(add);
    var active = strip.querySelector(".tab.active");
    if (focusedNewTab) {
      if (add.focus) add.focus();
    } else if (focusedLabel) {
      var restore = strip.querySelector('.tab[data-label="' + focusedLabel.replace(/["\\]/g, "\\$&") + '"]');
      if (restore && restore.focus) restore.focus();
      else if (active && active.focus) active.focus();
    }
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  function refresh() {
    applyPrefs();
    handleCrossTabCommand();
    if (refreshing) return;
    refreshing = true;
    invoke("tab_list", {}).then(render).catch(function () {}).finally(function () {
      refreshing = false;
    });
  }

  var lastCmdKey = null;
  // Execute cross-webview tab commands sent from Control Center Command Palette / Workspaces
  function handleCrossTabCommand() {
    var cmd = readJson("np_tab_cmd", null);
    if (!cmd || !cmd.action) return;
    var cmdKey = cmd.id || cmd.ts;
    if (cmdKey && cmdKey === lastCmdKey) return;
    lastCmdKey = cmdKey || Date.now();
    try { localStorage.removeItem("np_tab_cmd"); } catch (e) {}
    if (cmd.action === "switch" && cmd.label) {
      invoke("tab_switch", { label: cmd.label }).then(refresh).catch(function () {});
    } else if (cmd.action === "close" && cmd.label) {
      var found = currentTabs.find(function (t) { return t.label === cmd.label; });
      closeTabWithHistory(found || { label: cmd.label });
    } else if (cmd.action === "open") {
      var openUrl = typeof cmd.url === "string" ? cmd.url : "";
      if (isSafeTabUrl(openUrl)) invoke("tab_open", { url: openUrl }).then(refresh).catch(function () {});
    } else if (cmd.action === "reopen") {
      reopenLastClosedTab();
    } else if (cmd.action === "meta_changed") {
      lastSignature = "";
      render(currentTabs);
    }
  }

  var stripEl = document.getElementById("tabs");
  stripEl.addEventListener("dblclick", function (ev) {
    if (ev.target === stripEl) {
      invoke("tab_open", { url: "" }).then(refresh).catch(function () {});
    }
  });
  stripEl.addEventListener("dragover", function (ev) {
    if (dragLabel && ev.target === stripEl) {
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = "move";
    }
  });
  stripEl.addEventListener("drop", function (ev) {
    if (!dragLabel || ev.target !== stripEl) return;
    ev.preventDefault();
    var label = dragLabel;
    dragLabel = null;
    clearDropHints(stripEl);
    invoke("tab_move", { label: label, toIndex: currentTabs.length })
      .then(refresh).catch(function () {});
  });

  window.addEventListener("pointermove", function (ev) {
    if (!ptrDrag) return;
    var x = ev.clientX || 0;
    var dx = x - ptrDrag.startX;
    if (!ptrDrag.active && Math.abs(dx) < 5) return;
    if (!ptrDrag.active) {
      ptrDrag.active = true;
      dragLabel = ptrDrag.label;
      ptrDrag.el.classList.add("dragging");
    }
    if (ev.preventDefault) ev.preventDefault();
    ptrDrag.el.style.transform = "translateX(" + dx + "px)";
    clearDropHints(stripEl);

    // Forgiving targeting: pick the nearest tab centre instead of
    // requiring the pointer to be exactly inside a tab's rectangle.
    // Gaps, the "+" button and the strip padding all accept a drop.
    var rtl = document.documentElement.dir === "rtl";
    var nodes = Array.prototype.slice.call(stripEl.querySelectorAll(".tab"));
    var bestNode = null;
    var bestDist = Infinity;
    var after = false;
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node === ptrDrag.el) continue;
      var r = node.getBoundingClientRect ? node.getBoundingClientRect() : { left: 0, width: 0 };
      var centre = (r.left || 0) + (r.width || 0) / 2;
      var dist = Math.abs(x - centre);
      if (dist < bestDist) {
        bestDist = dist;
        bestNode = node;
        after = rtl ? x < centre : x > centre;
      }
    }
    var idx = bestNode
      ? insertionIndexFor(parseInt(bestNode.getAttribute("data-index"), 10) || 0, after)
      : ptrDrag.fromIndex;
    ptrDrag.targetIndex = Math.max(0, Math.min(idx, currentTabs.length));
    if (bestNode) bestNode.classList.add("drop-hint");
  });

  function finishPointerDrag(commit) {
    if (!ptrDrag) return;
    var state = ptrDrag;
    ptrDrag = null;
    if (!state.active) return;
    lastDragEnd = Date.now();
    if (state.el.releasePointerCapture && state.pointerId != null) {
      try { state.el.releasePointerCapture(state.pointerId); } catch (e) {}
    }
    state.el.style.transform = "";
    state.el.classList.remove("dragging");
    clearDropHints(stripEl);
    dragLabel = null;
    if (commit && state.targetIndex !== state.fromIndex) {
      invoke("tab_move", { label: state.label, toIndex: state.targetIndex })
        .then(refresh).catch(function () { refresh(); });
    }
  }
  window.addEventListener("pointerup", function () { finishPointerDrag(true); });
  window.addEventListener("pointercancel", function () { finishPointerDrag(false); });
  window.addEventListener("lostpointercapture", function () { finishPointerDrag(false); });
  window.addEventListener("blur", function () {
    finishPointerDrag(false);
    if (!dragLabel) return;
    dragLabel = null;
    stripEl.querySelectorAll(".tab.dragging").forEach(function (n) { n.classList.remove("dragging"); });
    clearDropHints(stripEl);
  });

  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && (ptrDrag || dragLabel)) {
      if (ev.preventDefault) ev.preventDefault();
      finishPointerDrag(false);
      if (dragLabel) {
        dragLabel = null;
        stripEl.querySelectorAll(".tab.dragging").forEach(function (n) { n.classList.remove("dragging"); });
        clearDropHints(stripEl);
      }
      return;
    }
    if (!(ev.ctrlKey || ev.metaKey)) return;
    var k = String(ev.key || "").toLowerCase();
    if (k === "t" && ev.shiftKey) {
      ev.preventDefault();
      reopenLastClosedTab();
    } else if (k === "t" && !ev.shiftKey) {
      ev.preventDefault();
      invoke("tab_open", { url: "" }).then(refresh).catch(function () {});
    } else if (k === "w" && currentTabs.length) {
      ev.preventDefault();
      var activeTab = currentTabs.find(function (t) { return t.active; });
      if (activeTab) closeTabWithHistory(activeTab);
    } else if (k >= "1" && k <= "9") {
      var idx = parseInt(k, 10) - 1;
      if (currentTabs[idx]) {
        ev.preventDefault();
        invoke("tab_switch", { label: currentTabs[idx].label }).then(refresh).catch(function () {});
      }
    }
  });

  document.getElementById("btnBack").addEventListener("click", function () {
    invoke("nav_back", {}).catch(function () {});
  });
  document.getElementById("btnForward").addEventListener("click", function () {
    invoke("nav_forward", {}).catch(function () {});
  });
  document.getElementById("btnReload").addEventListener("click", function () {
    invoke("nav_reload", {}).catch(function () {});
  });
  var navLocks = Object.create(null);
  function runNavLocked(key, cmd) {
    if (navLocks[key]) return;
    navLocks[key] = true;
    invoke(cmd, {}).then(refresh).catch(function () {}).finally(function () { navLocks[key] = false; });
  }
  document.getElementById("btnSettings").addEventListener("click", function () {
    runNavLocked("settings", "open_settings");
  });
  document.getElementById("btnCc").addEventListener("click", function () {
    runNavLocked("cc", "open_control_center");
  });
  window.addEventListener("storage", function (ev) {
    applyPrefs();
    if (!ev) return;
    if (ev.key === "np_tab_cmd") handleCrossTabCommand();
    else if (ev.key === "np_pinned_tabs" || ev.key === "np_tab_groups") render(currentTabs);
  });
  applyPrefs();
  restoreSavedSession();
  refresh();
  window.setInterval(function () { if (!document.hidden) refresh(); }, 650);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
</script>
</body>
</html>
