<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Yaseir Print — Connecting</title>
<link rel="stylesheet" href="theme.css"/>
<style>
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-4);
    background: var(--bg-canvas);
    padding: var(--space-5);
  }
  .card {
    position: relative;
    overflow: hidden;
    width: min(92vw, 440px);
    margin-block: auto;
    background: var(--glass-bg-strong);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg), var(--glass-highlight);
    padding: calc(var(--space-8) + 3px) var(--space-6) var(--space-6);
    text-align: center;
    transition: border-color var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
  }
  .card::before {
    content: "";
    position: absolute;
    inset-inline: 0;
    top: 0;
    height: 3px;
    background: var(--brand);
    transition: background-color var(--dur-med) var(--ease-out);
  }
  .card[data-state="down"],
  .card[data-state="initFail"] { border-color: var(--err-border); }
  .card[data-state="down"]::before,
  .card[data-state="initFail"]::before { background: var(--err-fg); }
  .card[data-state="redirected"] { border-color: var(--warn-border); }
  .card[data-state="redirected"]::before { background: var(--warn-fg); }
  .logo-wrap {
    width: 56px; height: 56px; margin: 0 auto var(--space-5);
    border-radius: var(--radius-lg); padding: 6px;
    background: var(--brand-soft); border: 1px solid var(--info-border);
    box-shadow: 0 0 0 6px var(--brand-soft), var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .card[data-state="down"] .logo-wrap,
  .card[data-state="initFail"] .logo-wrap {
    background: var(--err-bg); border-color: var(--err-border);
    box-shadow: 0 0 0 6px var(--err-bg), var(--shadow-sm);
  }
  .card[data-state="redirected"] .logo-wrap {
    background: var(--warn-bg); border-color: var(--warn-border);
    box-shadow: 0 0 0 6px var(--warn-bg), var(--shadow-sm);
  }
  .logo { width: 100%; height: 100%; border-radius: var(--radius-sm); display: block; }
  .spinner {
    width: 24px; height: 24px; margin: 0 auto var(--space-4); border-radius: 50%;
    border: 2.5px solid var(--brand-soft); border-top-color: var(--brand-text);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: var(--text-lg); font-weight: 700; margin: 0 0 var(--space-2);
    color: var(--text-primary); letter-spacing: 0; line-height: 1.35;
  }
  [dir="ltr"] h1 { letter-spacing: -0.015em; }
  .card[data-state="down"] h1,
  .card[data-state="initFail"] h1 { color: var(--err-fg); }
  .card[data-state="redirected"] h1 { color: var(--warn-fg); }
  p {
    color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.6;
    margin: 0 0 var(--space-5);
  }
  .origin {
    display: inline-block; direction: ltr; unicode-bidi: isolate; font-family: var(--font-mono);
    font-size: var(--text-xs); font-weight: 600; color: var(--text-primary);
    background: var(--bg-subtle); border: 1px solid var(--border);
    padding: 2px var(--space-2); border-radius: var(--radius-xs); word-break: break-all;
    margin: 2px var(--space-1);
  }
  .card[data-state="connecting"] .origin { margin-top: var(--space-2); }
  .card[data-state="down"] .origin {
    background: var(--err-bg); border-color: var(--err-border); color: var(--err-fg);
  }
  .card[data-state="redirected"] .origin {
    background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg);
  }
  .actions {
    display: none; flex-wrap: wrap; gap: var(--space-2); justify-content: center;
    padding-top: var(--space-1);
  }
  .actions.show { display: flex; }
  button {
    min-height: 36px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px var(--space-4); font: inherit; font-size: var(--text-sm); font-weight: 500;
    cursor: pointer; background: var(--bg-surface); color: var(--text-primary);
    transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  button:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-strong); }
  button:active:not(:disabled) { background: var(--bg-hover); transform: scale(0.97); }
  button:focus-visible { box-shadow: var(--focus-ring); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.primary {
    background: var(--brand); border-color: var(--brand); color: var(--brand-fg); font-weight: 600;
  }
  button.primary:hover:not(:disabled),
  button.primary:active:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
  .count {
    font-size: var(--text-xs); color: var(--text-muted);
    margin-top: var(--space-4); min-height: 1.2em; font-variant-numeric: tabular-nums;
  }
  .credit { text-align: center; color: var(--text-muted); font-size: var(--text-xs); }
</style>
</head>
<body>
  <main class="card" data-state="connecting">
    <div class="logo-wrap"><img class="logo" src="app-icon.png" alt=""/></div>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <div role="status" aria-live="polite">
      <h1 id="title">جارٍ الاتصال بـ Odoo</h1>
      <p id="msg">تجهيز الجلسة… <br><span class="origin" id="origin"></span></p>
    </div>
    <div class="actions" id="actions">
      <button type="button" class="primary" id="retry">إعادة المحاولة</button>
      <button type="button" id="anyway">فتح مباشر</button>
      <button type="button" id="cc">مركز التحكم</button>
    </div>
    <div class="count" id="count" aria-live="off"></div>
  </main>
  <footer class="credit" id="credit">Yaseir Print © يسير</footer>
<script>
  "use strict";
  function invoke(cmd, args) {
    if (!window.__TAURI_INTERNALS__ || typeof window.__TAURI_INTERNALS__.invoke !== "function") {
      return Promise.reject(new Error("tauri_internals_unavailable"));
    }
    return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  }
  var STR = {
    en: {
      connecting: "Connecting to Odoo",
      preparing: "Starting session…",
      downTitle: "Odoo unreachable",
      downPre: "No response from ",
      downPost: " — retrying automatically.",
      redirTitle: "Slow response or redirect",
      redirPre: "No page loaded from ",
      redirPost: " — verify the URL in Control Center or retry.",
      retryIn: "Retrying in ",
      secs: "s…",
      retryBtn: "Retry",
      anywayBtn: "Open anyway",
      ccBtn: "Control Center",
      initFailTitle: "Startup error",
      initFailMsg: "Open Control Center to check Odoo settings.",
      credit: "Yaseir Print © Yaseir"
    },
    ar: {
      connecting: "جارٍ الاتصال بـ Odoo",
      preparing: "تجهيز الجلسة…",
      downTitle: "تعذّر الوصول إلى Odoo",
      downPre: "لا استجابة من ",
      downPost: " — إعادة المحاولة تلقائياً.",
      redirTitle: "تأخّر الاستجابة أو إعادة توجيه",
      redirPre: "لم تكتمل الصفحة من ",
      redirPost: " — راجع الرابط في مركز التحكم أو أعد المحاولة.",
      retryIn: "إعادة المحاولة خلال ",
      secs: " ث…",
      retryBtn: "إعادة المحاولة",
      anywayBtn: "فتح مباشر",
      ccBtn: "مركز التحكم",
      initFailTitle: "تعذّر بدء الاتصال",
      initFailMsg: "افتح مركز التحكم لمراجعة إعدادات Odoo.",
      credit: "Yaseir Print © يسير"
    }
  };
  var lang = "ar";
  var T = STR.ar;
  var viewState = "connecting";
  var cardEl = document.querySelector(".card");
  function setCardState(state) {
    viewState = state;
    if (cardEl) cardEl.setAttribute("data-state", state);
  }
  function setPrimaryAction(id) {
    ["retry", "anyway", "cc"].forEach(function (btnId) {
      var el = document.getElementById(btnId);
      if (el) el.classList.toggle("primary", btnId === id);
    });
  }

  function applyPrefs() {
    var savedLang = null, savedTheme = null;
    try {
      savedLang = localStorage.getItem("np_cc_lang");
      savedTheme = localStorage.getItem("np_cc_theme");
    } catch (e) {}
    lang = savedLang === "en" ? "en" : "ar";
    T = STR[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.documentElement.setAttribute("data-theme", savedTheme === "dark" ? "dark" : "light");
    document.title = "Yaseir Print — " + T.connecting;
    document.getElementById("retry").textContent = T.retryBtn;
    document.getElementById("anyway").textContent = T.anywayBtn;
    document.getElementById("cc").textContent = T.ccBtn;
    document.getElementById("credit").textContent = T.credit;
    if (viewState === "connecting") {
      document.getElementById("title").textContent = T.connecting;
      if (origin) {
        setMsgWithOrigin(T.preparing + " ", "");
      } else {
        var msgEl = document.getElementById("msg");
        if (msgEl && msgEl.firstChild && msgEl.firstChild.nodeType === 3) {
          msgEl.firstChild.nodeValue = T.preparing + " ";
        }
      }
    }
    else if (viewState === "down") showDown(true);
    else if (viewState === "redirected") showRedirected();
    else if (viewState === "initFail") showInitFail();
  }

  var origin = null;
  var timer = null;
  var left = 0;
  var probing = false;

  function setMsgWithOrigin(pre, post) {
    var msg = document.getElementById("msg");
    msg.textContent = pre;
    var span = document.createElement("span");
    span.className = "origin";
    span.textContent = origin || "";
    msg.appendChild(span);
    msg.appendChild(document.createTextNode(post));
  }

  function showDown(keepTimer) {
    setCardState("down");
    setPrimaryAction("retry");
    document.getElementById("spinner").style.display = "none";
    document.getElementById("title").textContent = T.downTitle;
    setMsgWithOrigin(T.downPre, T.downPost);
    document.getElementById("actions").classList.add("show");
    document.getElementById("retry").style.display = "";
    document.getElementById("anyway").style.display = "";
    if (!keepTimer) startCountdown();
    else if (left > 0) document.getElementById("count").textContent = T.retryIn + left + T.secs;
  }
  function showRedirected() {
    setCardState("redirected");
    setPrimaryAction("cc");
    disarmNavWatchdog();
    stopCountdown();
    document.getElementById("spinner").style.display = "none";
    document.getElementById("title").textContent = T.redirTitle;
    setMsgWithOrigin(T.redirPre, T.redirPost);
    document.getElementById("actions").classList.add("show");
    document.getElementById("retry").style.display = "";
    document.getElementById("anyway").style.display = "";
    document.getElementById("count").textContent = "";
  }
  function showInitFail() {
    setCardState("initFail");
    setPrimaryAction("cc");
    disarmNavWatchdog();
    stopCountdown();
    document.getElementById("title").textContent = T.initFailTitle;
    document.getElementById("msg").textContent = T.initFailMsg;
    document.getElementById("spinner").style.display = "none";
    document.getElementById("actions").classList.add("show");
    document.getElementById("retry").style.display = "none";
    document.getElementById("anyway").style.display = "none";
  }
  function startCountdown() {
    stopCountdown();
    left = 5;
    var el = document.getElementById("count");
    el.textContent = T.retryIn + left + T.secs;
    timer = window.setInterval(function () {
      if (document.hidden) return;
      left -= 1;
      if (left <= 0) { stopCountdown(); el.textContent = ""; tryProbe(); return; }
      el.textContent = T.retryIn + left + T.secs;
    }, 1000);
  }
  function stopCountdown() { if (timer) { window.clearInterval(timer); timer = null; } }

  var navTimer = null;
  function armNavWatchdog() {
    disarmNavWatchdog();
    navTimer = window.setTimeout(showRedirected, 12000);
  }
  function disarmNavWatchdog() { if (navTimer) { window.clearTimeout(navTimer); navTimer = null; } }

  function isHttpOrigin(u) {
    if (typeof u !== "string" || !/^https?:\/\//i.test(u)) return false;
    try {
      var parsed = new URL(u);
      return (parsed.protocol === "https:" || parsed.protocol === "http:") && parsed.hostname.length > 0 && !parsed.username && !parsed.password;
    } catch (e) { return false; }
  }
  function tryProbe() {
    if (probing) return;
    probing = true;
    setCardState("connecting");
    document.getElementById("title").textContent = T.connecting;
    if (origin) setMsgWithOrigin(T.preparing + " ", "");
    var retryBtn = document.getElementById("retry");
    if (retryBtn) retryBtn.disabled = true;
    document.getElementById("spinner").style.display = "block";
    invoke("probe_origin", {}).then(function (ok) {
      probing = false;
      if (retryBtn) retryBtn.disabled = false;
      if (ok && isHttpOrigin(origin)) { stopCountdown(); document.getElementById("count").textContent = ""; armNavWatchdog(); window.location.replace(origin); }
      else { showDown(false); }
    }).catch(function () {
      probing = false;
      if (retryBtn) retryBtn.disabled = false;
      showDown(false);
    });
  }

  document.getElementById("retry").addEventListener("click", function () {
    stopCountdown(); document.getElementById("count").textContent = ""; tryProbe();
  });
  document.getElementById("anyway").addEventListener("click", function () {
    if (isHttpOrigin(origin)) { stopCountdown(); document.getElementById("count").textContent = ""; armNavWatchdog(); window.location.replace(origin); }
  });
  document.getElementById("cc").addEventListener("click", function () {
    disarmNavWatchdog(); stopCountdown();
    window.location.replace("index.html");
  });

  window.addEventListener("pagehide", function () { stopCountdown(); disarmNavWatchdog(); });
  window.addEventListener("storage", applyPrefs);
  applyPrefs();

  // Use lightweight app_identity instead of heavyweight app_overview so startup never blocks on PDFium/spooler.
  invoke("app_identity", {}).then(function (ov) {
    origin = ov && (ov.odooOrigin || ov.odoo_origin) ? (ov.odooOrigin || ov.odoo_origin) : null;
    if (!isHttpOrigin(origin)) { window.location.replace("index.html"); return; }
    document.getElementById("origin").textContent = origin;
    tryProbe();
  }).catch(showInitFail);
</script>
</body>
</html>
