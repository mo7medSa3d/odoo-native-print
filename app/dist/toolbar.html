<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yaseir Print Toolbar</title>
<style>
  @font-face { font-family: "Thmanyah Sans"; src: url("fonts/thmanyahsans-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Thmanyah Sans"; src: url("fonts/thmanyahsans-Medium.otf") format("opentype"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Thmanyah Sans"; src: url("fonts/thmanyahsans-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Thmanyah Sans", system-ui, sans-serif;
    background: #ffffff;
    color: #101219;
    border-bottom: 1px solid #e3e8f0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0 0.6rem;
    height: 46px;
  }
  .nav-group { display: flex; align-items: center; gap: 0.15rem; }
  .tbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    height: 32px; min-width: 32px; padding: 0 0.45rem;
    border: 0; border-radius: 999px; background: transparent; color: #101219;
    cursor: pointer; font: inherit; font-size: 0.82rem; font-weight: 500;
  }
  .tbtn:hover { background: #eef3fd; }
  .tbtn:active { background: #dbe7fd; }
  .tbtn svg { width: 17px; height: 17px; flex: none; }
  .tbtn.primary { background: #0953DE; color: #fff; padding: 0 0.8rem; }
  .tbtn.primary:hover { background: #0743b4; }
  .divider { width: 1px; height: 22px; background: #e3e8f0; margin: 0 0.3rem; flex: none; }
  .title { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; justify-content: center; }
  .title .name { font-weight: 700; font-size: 0.86rem; white-space: nowrap; }
  .title .origin {
    font-size: 0.74rem; color: #5b6472; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: ltr; max-width: 340px;
  }
  .ver { font-size: 0.7rem; color: #8a93a5; white-space: nowrap; }
  @media (max-width: 760px) { .title .origin { display: none; } }
  @media (max-width: 560px) { .title .name { display: none; } .ver { display: none; } }
</style>
</head>
<body>
  <div class="nav-group">
    <button class="tbtn" id="btnBack" title="رجوع (Alt+←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="tbtn" id="btnForward" title="تقديم (Alt+→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="tbtn" id="btnReload" title="إعادة تحميل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="divider"></div>
  <div class="title">
    <span class="name">الطباعة من Yaseir</span>
    <span class="origin" id="originLabel"></span>
  </div>
  <span class="ver" id="verLabel"></span>
  <div class="divider"></div>
  <div class="nav-group">
    <button class="tbtn" id="btnOdoo" title="فتح Odoo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Odoo</span>
    </button>
    <button class="tbtn primary" id="btnCc" title="مركز التحكم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1 1.55.61.26 1.32.1 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09c.26.6.87 1 1.55 1H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1z"/></svg>
      <span>مركز التحكم</span>
    </button>
  </div>
<script>
  function invoke(cmd) {
    return window.__TAURI_INTERNALS__.invoke(cmd, {});
  }
  function on(id, cmd) {
    document.getElementById(id).addEventListener("click", function () {
      invoke(cmd).catch(function () {});
    });
  }
  on("btnBack", "nav_back");
  on("btnForward", "nav_forward");
  on("btnReload", "nav_reload");
  on("btnOdoo", "open_odoo_origin");
  on("btnCc", "open_control_center");
  invoke("app_identity").then(function (id) {
    if (!id) return;
    document.getElementById("verLabel").textContent = "v" + id.appVersion;
    if (id.odooOrigin) document.getElementById("originLabel").textContent = id.odooOrigin;
  }).catch(function () {});
</script>
</body>
</html>
