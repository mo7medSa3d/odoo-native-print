[package]
name = "odoo-native-print-app"
version = "1.5.7"
edition = "2021"
publish = false
rust-version = "1.89"

# Standalone workspace: this crate builds only on Windows (WebView2).
[workspace]

[lib]
name = "odoo_native_print_app"
crate-type = ["rlib"]

# The Tauri version floor is a security requirement, not a preference:
# CVE-2026-42184 origin confusion is fixed in 2.11.1 (ADR-0002).
[dependencies]
tauri = { version = ">=2.11.1, <2.13", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
print-core = { path = "../../crates/print-core" }
print-ipp = { path = "../../crates/print-ipp" }
print-raw = { path = "../../crates/print-raw" }
print-render = { path = "../../crates/print-render" }
print-win = { path = "../../crates/print-win" }

[build-dependencies]
tauri-build = { version = ">=2.6, <2.8" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Keep unwind: spawn_worker_loop in src/commands.rs uses std::panic::catch_unwind.
panic = "unwind"
