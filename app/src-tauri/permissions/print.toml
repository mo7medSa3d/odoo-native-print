[[permission]]
identifier = "allow-print-pdf"
description = "Allow the configured Odoo origin to submit print jobs and test prints."
commands.allow = [
    "print_pdf",
    "print_text",
    "print_image",
]

[[permission]]
identifier = "allow-print-status"
description = "Allow the configured Odoo origin and local Control Center to query job status and printer information (read-only)."
commands.allow = [
    "print_status",
    "job_detail",
    "app_overview",
    "list_printers",
    "printer_forms",
    "printer_capabilities",
    "report_environment",
]

[[permission]]
identifier = "allow-queue-admin"
description = "Local Control Center only: manage the queue, export diagnostics, change settings. Never granted to the remote Odoo origin."
commands.allow = [
    "retry_job_cmd",
    "cancel_job_cmd",
    "clear_finished_cmd",
    "export_diagnostics",
    "save_origin_cmd",
    "get_printer_settings",
    "set_printer_settings",
]

[[permission]]
identifier = "allow-app-shell"
description = "App-shell action initiated by a user click, granted to the configured Odoo origin and the local Control Center: switch to the Control Center view, or open a new tab (Rust validates the tab URL against the configured origin)."
commands.allow = [
    "open_control_center",
    "tab_open",
]

[[permission]]
identifier = "allow-web-data-reset"
description = "Local Control Center only: reset this app's own browsing data (cache, cookies, storage) as a self-heal for a broken webview environment. Deliberately NOT granted to the remote Odoo origin: the wipe logs the user out, so a remote page must never be able to trigger it (a script on the origin could otherwise loop it into a permanent forced logout). Never exposes print data or settings."
commands.allow = [
    "clear_web_data_cmd",
]

[[permission]]
identifier = "allow-toolbar"
description = "Tab bar webview only (local, app-bundled tabbar.html): browser-style navigation of the active tab, tab management, the lightweight app identity, and switching between Odoo and the Control Center. Never granted to the remote Odoo origin."
commands.allow = [
    "nav_back",
    "nav_forward",
    "nav_reload",
    "tab_list",
    "tab_switch",
    "tab_close",
    "app_identity",
    "open_control_center",
    "open_odoo_origin",
]

[[permission]]
identifier = "allow-local-tools"
description = "Local Control Center and boot page only: printer test prints / calibrations and the origin reachability probe. Never granted to the remote Odoo origin (test prints fire raw printer language at local printers)."
commands.allow = [
    "run_test_print",
    "probe_origin",
]
