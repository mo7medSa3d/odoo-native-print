[[permission]]
identifier = "allow-print-pdf"
description = "Allow the configured Odoo origin to submit print jobs and test prints."
commands.allow = [
    "print_pdf",
    "print_text",
    "print_image",
    "run_test_print",
]

[[permission]]
identifier = "allow-print-status"
description = "Allow the configured Odoo origin and local Control Center to query job status and printer information (read-only)."
commands.allow = [
    "print_status",
    "job_detail",
    "app_overview",
    "list_printers",
    "printer_forms",
    "printer_capabilities",
    "report_environment",
]

[[permission]]
identifier = "allow-queue-admin"
description = "Local Control Center only: manage the queue, export diagnostics, change settings. Never granted to the remote Odoo origin."
commands.allow = [
    "retry_job_cmd",
    "cancel_job_cmd",
    "clear_finished_cmd",
    "export_diagnostics",
    "save_origin_cmd",
]

[[permission]]
identifier = "allow-app-shell"
description = "App-shell actions initiated by a user click, granted to the configured Odoo origin and the local Control Center: switch to the Control Center, and reset this app's own browsing data (cache, cookies, storage) as a self-heal for a broken webview environment. Affects only this app; never exposes print data or settings."
commands.allow = [
    "open_control_center",
    "clear_web_data_cmd",
]

[[permission]]
identifier = "allow-toolbar"
description = "Toolbar webview only (local, app-bundled page): browser-style navigation of the main webview, the lightweight app identity, and switching between Odoo and the Control Center. Never granted to the remote Odoo origin."
commands.allow = [
    "nav_back",
    "nav_forward",
    "nav_reload",
    "app_identity",
    "open_control_center",
    "open_odoo_origin",
]
