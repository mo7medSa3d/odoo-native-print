name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: Core (Linux) - fmt, clippy, tests, addon checks, bench, chaos
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (workspace)
        run: cargo fmt --all --check
      - name: Format (Windows-only sources)
        run: |
          for f in app/src-tauri/src/*.rs app/src-tauri/build.rs crates/print-win/src/*.rs crates/print-win/src/bin/*.rs; do
            rustfmt --edition 2021 --check "$f"
          done
      - name: Clippy (workspace, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (workspace)
        run: cargo test --workspace
      - name: print-win on Linux (stub platform + shared logic tests)
        working-directory: crates/print-win
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Addon static checks (Python compiles, XML parses, JS parses)
        run: |
          python3 -m compileall -q odoo/native_print
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          for p in pathlib.Path("odoo/native_print").rglob("*.xml"):
              xml.dom.minidom.parse(str(p))
          print("addon XML OK")
          PY
          for f in odoo/native_print/static/src/js/*.js; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs
          done
          echo "addon JS OK"
      - name: Consistency gates (command surface, versions, JS unit tests)
        run: |
          python3 tools/check_command_surface.py
          python3 tools/check_versions.py
          node odoo/native_print/tests/test_live_target.mjs
          node odoo/native_print/tests/test_pos_keys.mjs
      - name: Bench, chaos, calibration (measured evidence)
        run: |
          set -o pipefail
          mkdir -p evidence
          cargo run --release -p print-tools -- bench | tee evidence/bench.txt
          cargo run --release -p print-tools -- chaos | tee evidence/chaos.txt
          cargo run --release -p print-tools -- calibration | tee evidence/calibration.txt
      - name: Upload Linux evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-linux
          path: evidence/

  audit:
    name: Supply chain - audit and deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  windows-tests:
    name: Windows - workspace tests + print-win (real Win32 compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests (workspace, MSVC)
        run: cargo test --workspace
      - name: Clippy (workspace, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: print-win tests + probe build (real winspool FFI)
        working-directory: crates/print-win
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --bin npwin_probe
      - name: Upload the Windows probe
        uses: actions/upload-artifact@v7
        with:
          name: npwin-probe
          path: crates/print-win/target/release/npwin_probe.exe

  windows-app:
    name: Windows - build the app installers (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - name: Build the app and bundles (unsigned CI build)
        working-directory: app
        run: npm run build
      - name: List bundle outputs
        shell: powershell
        run: Get-ChildItem -Recurse app/src-tauri/target/release/bundle | Select-Object FullName, Length
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-print-smoke:
    name: Windows - printer discovery smoke (hosted runner)
    runs-on: windows-latest
    needs: windows-tests
    steps:
      - name: Download the probe
        uses: actions/download-artifact@v8
        with:
          name: npwin-probe
      - name: Discover printers on this runner
        shell: powershell
        run: |
          .\npwin_probe.exe list | Tee-Object -FilePath probe-list.txt
          Write-Host "--- Get-Printer ---"
          try { Get-Printer | Format-Table Name, PrinterStatus, PortName -AutoSize | Out-String | Write-Host } catch { Write-Host "Get-Printer unavailable: $_" }
          Write-Host "Note: GitHub-hosted runners normally expose no real printers."
          Write-Host "Real-printer coverage runs in the Printer Lab workflow on a self-hosted runner."
      - name: Upload smoke results
        uses: actions/upload-artifact@v7
        with:
          name: windows-print-smoke
          path: probe-list.txt
