name: Android CI

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: itbaa-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK (when keystore secret configured)
        if: ${{ secrets.ITBAA_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ITBAA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ITBAA_ANDROID_KEYSTORE_BASE64 }}
          ITBAA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ITBAA_ANDROID_KEYSTORE_PASSWORD }}
          ITBAA_ANDROID_KEY_ALIAS: ${{ secrets.ITBAA_ANDROID_KEY_ALIAS }}
          ITBAA_ANDROID_KEY_PASSWORD: ${{ secrets.ITBAA_ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/itbaa-release.jks"' EXIT
          printf '%s' "$ITBAA_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/itbaa-release.jks"
          export ITBAA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/itbaa-release.jks"
          gradle :app:assembleRelease
          cd app/build/outputs/apk/release
          sha256sum -- *.apk > SHA256SUMS.txt
