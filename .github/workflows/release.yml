name: Release

# Push a version tag (e.g. v0.3.0 or v0.4.0-rc4) to build everything and
# publish a GitHub Release with the Windows installers, the source
# tarball, and SHA-256 checksums. Can also be run manually to produce
# the artifacts without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate-linux:
    name: Release gate (Linux) - full test suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run --release -p print-tools -- bench
      - run: cargo run --release -p print-tools -- chaos
      - name: Consistency gates (command surface + versions vs tag)
        run: |
          python3 tools/check_command_surface.py
          python3 tools/check_versions.py
      - name: Source tarball
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          git archive --format=tar.gz --prefix="odoo-native-print-${VERSION}/" \
            -o "odoo-native-print-${VERSION}-source.tar.gz" HEAD
      - name: Upload source tarball
        uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: "*-source.tar.gz"

  windows-installers:
    name: Release - Windows installers (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Tests (workspace + print-win, real Windows)
        run: |
          cargo test --workspace
          cd crates/print-win && cargo test && cd ../..
      - name: Install Tauri CLI
        working-directory: app
        run: npm ci
      - name: Code signing (when a certificate is configured)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "No signing certificate configured: installers will be UNSIGNED."
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $sec -CertStoreLocation Cert:\CurrentUser\My
          $confPath = "app/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $conf.bundle.windows.digestAlgorithm = "sha256"
          $conf.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $conf | ConvertTo-Json -Depth 32 | Set-Content $confPath -Encoding utf8
          Write-Host "Signing enabled with certificate $($cert.Thumbprint)"
      - name: Build the app and bundles
        working-directory: app
        run: npm run build
      - name: Collect installers + checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item "app/src-tauri/target/release/bundle/msi/*.msi" release-files/
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*.exe" release-files/
          Get-ChildItem release-files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -Encoding ascii release-files/SHA256SUMS.txt
          Get-ChildItem release-files | Select-Object Name, Length
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: release-files/
          if-no-files-found: error
      # Code signing: when the company adds its certificate, wire it here
      # (secrets WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD with
      # signtool, or Tauri's signing config). Until then the installers
      # are UNSIGNED and the release notes say so.

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: [gate-linux, windows-installers]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all release files
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Odoo Native Print ${{ github.ref_name }}

          Windows installers (MSI + NSIS) and the full source tree.
          Verification evidence for this tree: see PROGRESS.md and
          docs/release-checklist.md in the source tarball (test suite,
          bench and chaos results are produced by the Release workflow's
          Linux gate on this exact tag).

          **Installers are unsigned** until the company's code-signing
          certificate is wired into the release workflow; Windows may
          show a SmartScreen prompt. Field gates (real Odoo 19, real
          printers) are listed in docs/release-checklist.md.
          EOF
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
