name: Odoo Addon Tests

# Installs the native_print addon on a real Odoo (Docker) with Postgres
# and runs only this addon's suite via --test-tags /native_print. This is the CI form
# of spike S2; the interactive parts of S2/S2b (clicking through the UI
# inside the app, POS receipts) still run at the client's site.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "odoo/**"
      - ".github/workflows/odoo.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "odoo/**"
      - ".github/workflows/odoo.yml"

jobs:
  addon-tests:
    name: Odoo 19 - install addon + run its tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Pick an Odoo image (19.0 preferred)
        run: |
          ODOO_IMAGE=""
          for tag in 19.0 19 latest; do
            if docker pull "odoo:$tag"; then
              ODOO_IMAGE="odoo:$tag"
              echo "ODOO_IMAGE=$ODOO_IMAGE" >> "$GITHUB_ENV"
              echo "Using $ODOO_IMAGE"
              break
            fi
          done
          if [ -z "$ODOO_IMAGE" ]; then
            echo "::error::Unable to pull any supported Odoo image (19.0, 19, latest)."
            exit 1
          fi
      - name: Start Postgres and run Odoo with the addon + tests
        run: |
          set -o pipefail
          docker network create odoo-test
          docker run -d --name db --network odoo-test \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo \
            postgres:16
          # Wait for Postgres to accept connections.
          for i in $(seq 1 30); do
            if docker run --rm --network odoo-test -e PGPASSWORD=odoo postgres:16 \
                 pg_isready -h db -U odoo > /dev/null 2>&1; then
              echo "Postgres is ready"; break
            fi
            sleep 2
          done
          set +e
          docker run --rm --network odoo-test \
            -v "$PWD/odoo:/mnt/extra-addons" \
            -e HOST=db -e USER=odoo -e PASSWORD=odoo \
            "$ODOO_IMAGE" \
            -d native_print_test -i native_print \
            --test-tags /native_print --stop-after-init --without-demo=all \
            2>&1 | tee odoo-test.log
          ODOO_EXIT=${PIPESTATUS[0]}
          set -e
          echo "odoo exit code: $ODOO_EXIT"
          # Odoo's exit code is the primary signal; the log grep is a
          # belt-and-braces check for failed test summaries. The full
          # log is uploaded below either way; if the first run shows the
          # heuristic misfiring, calibrate it from that real log.
          if [ "$ODOO_EXIT" -ne 0 ]; then
            echo "::error::Odoo run failed (exit $ODOO_EXIT)"; exit 1
          fi
          if grep -E "odoo.tests.result: .*([1-9][0-9]* failed|[1-9][0-9]* error)" odoo-test.log; then
            echo "::error::Odoo test failures or errors were reported"; exit 1
          fi
          if ! grep -E "odoo.tests.stats: native_print: [1-9][0-9]* tests" odoo-test.log; then
            echo "::error::The native_print test suite did not execute"; exit 1
          fi
          grep -E "native_print" odoo-test.log | tail -20 || true
          echo "native_print install + tests finished."
      - name: Upload the Odoo log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: odoo-test.log
