# cargo-deny configuration (supply chain, spec section 7).
[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "LicenseRef-Proprietary"]
confidence-threshold = 0.8

[bans]
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
